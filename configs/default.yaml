# Default pipeline configuration. Every threshold used by the pipeline lives here.
# Sections map 1:1 to dataclasses in src/config.py; unknown keys are rejected.

dataset:
  extensions: [".jpg", ".jpeg", ".png", ".tif", ".tiff"]
  min_images: 2
  blur_threshold: 100.0        # Laplacian variance (at <= 800 px) below this triggers a warning
  duplicate_max_distance: 2    # dHash Hamming distance (of 64 bits) flagging near-duplicates

preprocessing:
  max_side: 1600               # longest image side in px after resizing; null keeps original
  undistort: true              # only applied when distortion coefficients are known

camera:
  calibration_file: null       # path to configs/camera.yaml when calibrated
  use_exif: true               # derive K from the EXIF 35 mm-equivalent focal length if present
  fallback_focal_factor: 1.2   # f = factor * max(width, height) when K is unknown

features:
  detector: sift               # sift | orb (detection always runs on the grayscale image)
  max_features: 8000           # strict cap; the strongest responses are kept
  root_sift: false             # Hellinger-normalised SIFT descriptors (Arandjelovic & Zisserman 2012)
  sift_contrast_threshold: 0.04  # lower it for low-texture objects (more, weaker features)
  cache_dir: outputs/cache/features  # null disables the on-disk feature cache

matching:
  ratio: 0.75                  # Lowe ratio test: keep if d1 < ratio * d2
  mutual: true                 # keep only mutual nearest neighbours (one-to-one)
  method: bruteforce           # bruteforce (exact, deterministic) | flann (approximate, seeded)
  pair_mode: exhaustive        # exhaustive (all pairs) | sequential (j - i <= window)
  sequential_window: 5
  min_matches: 30              # an image whose best pair has fewer is reported as isolated

verification:
  method: auto                 # auto: essential if both images have file/EXIF intrinsics, else fundamental
  estimator: usac_accurate     # usac_accurate | usac_magsac | ransac (all seeded, reproducible)
  ransac_threshold_px: 1.5     # max Sampson distance (px) for an inlier, for both models
  confidence: 0.999
  min_inliers: 30              # pairs with fewer inliers are rejected
  planar_ratio: 0.8            # homography/epipolar inlier ratio above which a pair counts as planar

triangulation:
  max_reprojection_error_px: 2.0
  min_angle_deg: 1.5

filtering:
  statistical_nb_neighbors: 20
  statistical_std_ratio: 2.0

output:
  root: outputs
  save_intermediates: true

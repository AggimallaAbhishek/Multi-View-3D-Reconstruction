# Default pipeline configuration. Every threshold used by the pipeline lives here.
# Sections map 1:1 to dataclasses in src/config.py; unknown keys are rejected.

dataset:
  extensions: [".jpg", ".jpeg", ".png", ".tif", ".tiff"]
  min_images: 2
  blur_threshold: 30.0         # absolute floor on Laplacian variance (catches all-blurry sets)
  blur_relative: 0.35          # ...and blurry if below this fraction of the dataset median
  blur_working_side: 800       # blur is measured with the longest side capped here
  dhash_size: 32               # difference hash on a 33x32 thumbnail (1024 bits)
  duplicate_max_fraction: 0.04 # near-duplicates: at most this share of hash bits differ

preprocessing:
  max_side: 1600               # longest image side in px after resizing; null keeps original
  undistort: true              # only applied when distortion coefficients are known

camera:
  calibration_file: null       # path to configs/camera.yaml when calibrated
  use_exif: true               # derive K from the EXIF 35 mm-equivalent focal length if present
  fallback_focal_factor: 1.2   # f = factor * max(width, height) when K is unknown
  aspect_tolerance: 0.01       # relative x/y scale mismatch allowed when rescaling a calibration

calibration:                   # checkerboard calibration (python -m src.cli calibrate)
  min_views: 3                 # images in which the board must be found
  subpix_window: 11            # cornerSubPix search window side (px)
  subpix_max_iter: 30
  subpix_eps: 0.001

features:
  detector: sift               # sift | orb (detection always runs on the grayscale image)
  max_features: 8000           # strict cap; the strongest responses are kept
  root_sift: false             # Hellinger-normalised SIFT descriptors (Arandjelovic & Zisserman 2012)
  sift_contrast_threshold: 0.04  # lower it for low-texture objects (more, weaker features)
  warn_min_features: 100       # warn about images with fewer features...
  warn_min_coverage: 0.25      # ...or keypoints on less than this share of the coverage grid
  coverage_grid: 8             # coverage is measured on a grid x grid partition of the image

matching:
  ratio: 0.75                  # Lowe ratio test: keep if d1 < ratio * d2
  mutual: true                 # keep only mutual nearest neighbours (one-to-one)
  method: bruteforce           # bruteforce (exact, deterministic) | flann (approximate, seeded)
  flann_trees: 5               # flann: randomised k-d trees per index
  flann_checks: 64             # flann: leaves visited per query (accuracy vs speed)
  pair_mode: auto              # auto | exhaustive (all pairs) | sequential (j - i <= window)
  exhaustive_max_images: 50    # auto: exhaustive up to this many images, sequential above
  sequential_window: 5
  min_matches: 30              # an image whose best pair has fewer is reported as isolated

verification:
  method: auto                 # auto: essential if both images have file/EXIF intrinsics, else fundamental
  estimator: usac_accurate     # usac_accurate | usac_magsac | ransac (all seeded, reproducible)
  ransac_threshold_px: 1.5     # max Sampson distance (px) for an inlier, for both models
  confidence: 0.999
  min_inliers: 30              # pairs with fewer inliers are rejected
  planar_ratio: 0.8            # homography/epipolar inlier ratio above which a pair counts as planar
  refine: true                 # essential: minimise inlier Sampson error over (R, t) after RANSAC

pose:
  min_points: 30               # verified correspondences needed to estimate a relative pose
  min_cheirality_ratio: 0.9    # share of points that must lie in front of both cameras
  min_parallax_deg: 1.0        # median ray angle below this: rotation only, no depth information
  max_depth: 50.0              # depth limit in baseline units; farther points count as at infinity
  init_min_parallax_deg: 4.0   # the initial reconstruction pair needs at least this median angle

triangulation:
  max_reprojection_error_px: 2.0  # reject a point if any observation reprojects farther than this
  min_angle_deg: 1.5           # reject points whose largest ray angle is smaller (depth is unreliable)
  refine: true                 # Gauss-Newton refinement of each point's reprojection error after DLT
  refine_iterations: 5

registration:                  # adding an image to the reconstruction from 2D-3D links (PnP)
  reprojection_error_px: 4.0   # RANSAC: max reprojection error (px) of an inlier link
  confidence: 0.999
  max_iterations: 1000
  min_inliers: 30              # links that must agree with the pose to register the image
  min_inlier_ratio: 0.25       # ...and at least this share of its links
  refine: true                 # Levenberg-Marquardt refinement of the pose on the inliers

bundle_adjustment:             # joint refinement of camera poses and points (K stays fixed)
  enabled: true
  loss: soft_l1                # linear | soft_l1 | huber | cauchy. soft_l1 (smooth Huber) is robust
                               # and converges in ~30 evaluations; SciPy's huber crawls (100s)
  loss_scale_px: 1.0           # reprojection error (px) where the robust loss starts to flatten
  max_iterations: 100          # function evaluations per adjustment
  function_tolerance: 1.0e-6   # stop when the cost falls by less than this fraction (as Ceres);
                               # SciPy's 1e-8 crawls on for ~15x longer for <0.01 deg
  local_window: 5              # local BA after each registration: newest cameras left free
  global_every: 5              # global BA after this many registrations (and at the end)
  max_refinements: 3           # final rounds of global BA + filtering / re-triangulation,
                               # stopping early once a round changes no observation

filtering:                     # cleaning the multi-view cloud before export (filtered.ply)
  max_reprojection_error_px: 1.0  # drop points whose mean reprojection error is higher
  min_track_length: 2          # drop points seen in fewer images (3 drops ~35 % on templeRing)
  statistical_nb_neighbors: 20 # statistical outlier removal (0 disables): mean distance to
  statistical_std_ratio: 2.0   # this many neighbours above average + ratio * std
  radius_nb_points: 4          # radius outlier removal (0 disables): fewer neighbours than
  radius_scale: 5.0            # this within radius_scale * median distance to the
                               # radius_nb_points-th neighbour (relative: SfM has no scale)

output:
  root: outputs
  cache_dir: outputs/cache     # features, matches and prepared images; null disables caching

performance:
  workers: 0                   # threads for geometric verification (RANSAC is single-threaded); 0 = all cores
